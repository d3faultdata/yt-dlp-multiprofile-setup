# ==========================================================
# GLOBAL DEFAULTS
# ==========================================================
[default]
--impersonate chrome
--extractor-args "youtube:player-client=web_safari"
--force-ipv4
--ignore-errors
--no-part

# --- ULTRA QUALITY ---
--format "bestvideo+bestaudio/best"
--merge-output-format mkv
--audio-quality 0

# --- THE "- TOPIC" CLEANER ---
# This scrubs " - Topic" from any field it might appear in
--replace-in-metadata "uploader" " - Topic$" ""
--replace-in-metadata "artist" " - Topic$" ""
--replace-in-metadata "creator" " - Topic$" ""
--replace-in-metadata "playlist_title" " - Topic$" ""
--replace-in-metadata "playlist_uploader" " - Topic$" ""

# --- RELIABILITY ---
--retries 10
--fragment-retries 10
--retry-sleep exp=5:120

# --- STEALTH & CONSOLE ---
--sleep-requests 1.5
--sleep-interval 2
--max-sleep-interval 30
# (no --newline: keeps each song on a single in-place updating progress line)
--progress-template "[download] %(progress._percent_str)s of %(progress._total_bytes_str)s at %(progress._speed_str)s ETA %(progress._eta_str)s"

# --- INTERNAL METADATA ---
--embed-metadata
--embed-thumbnail
--embed-chapters
--convert-thumbnails jpg
--windows-filenames
# Use real artist from YT Music metadata; fall back to uploader only if missing
--parse-metadata "%(artist,uploader)s:%(meta_artist)s"
# Use the actual release year from YouTube Music metadata (from "Released on: YYYY-MM-DD" in description)
# Falls back to empty string if release_year is not available, which is better than the wrong upload date
--parse-metadata "%(release_year|)s:%(meta_date)s"

--no-write-description
--no-write-info-json

# ==========================================================
# AUDIO PROFILES (Audio Only + No "- Topic")
# ==========================================================

[yt-playlist]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
--yes-playlist
-o "D:/data-hoarding-media/audio/playlists/yt-playlists/%(playlist_title)s/%(uploader)s - %(title)s.%(ext)s"

[yt-album]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
--parse-metadata "playlist_index:%(track_number)s"
--parse-metadata "%(album,playlist_title)s:%(meta_album)s"
# NOTE: dlp.ps1 overrides this -o for yt-album: it pins ONE album artist for the
# whole playlist so featured/remix tracks don't scatter into their own folders.
-o "D:/data-hoarding-media/audio/albums/%(playlist_uploader,uploader)s/%(album,playlist_title)s/%(title)s.%(ext)s"

[yt-single]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
-o "D:/data-hoarding-media/audio/singles/%(artist,uploader)s - %(title)s.%(ext)s"

[yt-podcasts]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
-o "D:/data-hoarding-media/audio/podcasts/%(uploader)s/%(title)s.%(ext)s"
# Podcasts kept as m4a - wider compatibility for podcast apps

[sc-playlist]
-x
--format "bestaudio/best"
--audio-format m4a
--playlist-reverse
-o "D:/data-hoarding-media/audio/playlists/sc-playlists/Likes/%(title)s.%(ext)s"

# ==========================================================
# VIDEO PROFILES (Keeps .description files)
# ==========================================================

[yt-video]
--write-description
--sponsorblock-remove all
-o "D:/data-hoarding-media/video/youTube/%(uploader)s/%(upload_date)s - %(title)s.mkv"

[yt-clip]
--write-description
--sponsorblock-remove sponsor,selfpromo
-o "D:/data-hoarding-media/video/clips/%(uploader)s/%(title)s.mkv"

[yt-tv]
--write-description
-o "D:/data-hoarding-media/video/tv-shows/%(series)s/Season %(season_number)s/%(series)s - S%(season_number)02dE%(episode_number)02d - %(title)s.mkv"

[yt-movie]
--write-description
-o "D:/data-hoarding-media/video/movies/%(title)s/%(title)s.mkv"

[av-set]
-f "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]"
--restrict-filenames
-o "%(playlist_index)02d_%(title)s.mp4"


# ==========================================================
# CHANNEL ARCHIVE PROFILE (Clean List + Hidden Descriptions)
# ==========================================================
[yt-channel-audio]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
--write-description

# 1. The Audio File (Main Folder)
-o "D:/data-hoarding-media/audio/channels/%(uploader)s/%(title)s.%(ext)s"

# 2. The Description File (Sub-folder named 'descriptions')
-o "description:D:/data-hoarding-media/audio/channels/%(uploader)s/descriptions/%(title)s.%(ext)s"

[yt-channel-video]
--write-description
--sponsorblock-remove all
-o "D:/data-hoarding-media/video/channels/%(uploader)s/%(upload_date)s - %(title)s.mkv"
-o "description:D:/data-hoarding-media/video/channels/%(uploader)s/descriptions/%(upload_date)s - %(title)s.%(ext)s"