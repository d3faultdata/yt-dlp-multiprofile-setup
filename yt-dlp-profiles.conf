# ==========================================================
# These profiles are EXAMPLES / starting points - edit them, delete the ones you
# do not use, or add your own. A profile is just a [name] section of yt-dlp
# options. The output paths below (audio/albums, video/channels, ...) are a
# suggested layout; change any -o template to organize files however you like.
# See the README "Customizing profiles" section.
#
# [default] applies to every download; each [profile] adds or overrides on top.
# ==========================================================
# GLOBAL DEFAULTS
# ==========================================================
[default]
--impersonate chrome
# Do NOT pin a YouTube player-client here. Forcing one (we previously used
# "web_safari") breaks when YouTube stops serving media to it - the symptom is
# "WARNING: Only images are available for download" and then "Requested format
# is not available". yt-dlp's default client selection is maintained upstream
# and adapts to YouTube's changes, so let it choose. Keep yt-dlp updated.
--force-ipv4
--ignore-errors
--no-part

# --- ULTRA QUALITY ---
--format "bestvideo+bestaudio/best"
--merge-output-format mkv
--audio-quality 0

# --- THE "- TOPIC" CLEANER ---
# This scrubs " - Topic" from any field it might appear in
--replace-in-metadata "uploader" " - Topic$" ""
--replace-in-metadata "artist" " - Topic$" ""
--replace-in-metadata "creator" " - Topic$" ""
--replace-in-metadata "playlist_title" " - Topic$" ""
--replace-in-metadata "playlist_uploader" " - Topic$" ""

# --- RELIABILITY ---
--retries 10
--fragment-retries 10
--retry-sleep exp=5:120

# --- STEALTH & CONSOLE ---
--sleep-requests 1.5
--sleep-interval 2
--max-sleep-interval 30
# (no --newline: keeps each song on a single in-place updating progress line)
--progress-template "[download] %(progress._percent_str)s of %(progress._total_bytes_str)s at %(progress._speed_str)s ETA %(progress._eta_str)s"

# --- INTERNAL METADATA ---
--embed-metadata
--embed-thumbnail
--embed-chapters
--convert-thumbnails jpg
--windows-filenames
# Use real artist from YT Music metadata; fall back to uploader only if missing
--parse-metadata "%(artist,uploader)s:%(meta_artist)s"
# Use the actual release year from YouTube Music metadata (from "Released on: YYYY-MM-DD" in description)
# Falls back to empty string if release_year is not available, which is better than the wrong upload date
--parse-metadata "%(release_year|)s:%(meta_date)s"

--no-write-description
--no-write-info-json

# ==========================================================
# AUDIO PROFILES (Audio Only + No "- Topic")
# ==========================================================

[yt-playlist]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
--yes-playlist
-o "audio/playlists/yt-playlists/%(playlist_title)s/%(uploader)s - %(title)s.%(ext)s"

[yt-album]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
--parse-metadata "playlist_index:%(track_number)s"
--parse-metadata "%(album,playlist_title)s:%(meta_album)s"
# NOTE: dlp.py overrides this -o for yt-album: it pins ONE album artist for the
# whole playlist so featured/remix tracks don't scatter into their own folders.
-o "audio/albums/%(playlist_uploader,uploader)s/%(album,playlist_title)s/%(title)s.%(ext)s"

[yt-single]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
-o "audio/singles/%(artist,uploader)s - %(title)s.%(ext)s"

[yt-podcasts]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
-o "audio/podcasts/%(uploader)s/%(title)s.%(ext)s"
# Podcasts kept as m4a - wider compatibility for podcast apps

[sc-playlist]
-x
--format "bestaudio/best"
--audio-format m4a
--playlist-reverse
-o "audio/playlists/sc-playlists/Likes/%(title)s.%(ext)s"

# ==========================================================
# VIDEO PROFILES (Keeps .description files)
# ==========================================================

[yt-video]
--write-description
# Only cut ads and self-promo; keep intros/outros/etc. so the video stays
# watchable. Use "all" as a one-off override to also strip intros, outros,
# filler and non-music sections: dlp yt-video "<url>" --sponsorblock-remove all
--sponsorblock-remove sponsor,selfpromo
-o "video/youTube/%(uploader)s/%(upload_date)s - %(title)s.mkv"

[yt-tv]
--write-description
-o "video/tv-shows/%(series)s/Season %(season_number)s/%(series)s - S%(season_number)02dE%(episode_number)02d - %(title)s.mkv"

[yt-movie]
--write-description
-o "video/movies/%(title)s/%(title)s.mkv"


# ==========================================================
# CHANNEL ARCHIVE PROFILE (Clean List + Hidden Descriptions)
# ==========================================================
[yt-channel-audio]
-x
--format "bestaudio[ext=m4a]/bestaudio/best"
--audio-format m4a
--write-description

# 1. The Audio File (Main Folder)
-o "audio/channels/%(uploader)s/%(title)s.%(ext)s"

# 2. The Description File (Sub-folder named 'descriptions')
-o "description:audio/channels/%(uploader)s/descriptions/%(title)s.%(ext)s"

[yt-channel-video]
--write-description
--sponsorblock-remove all
-o "video/channels/%(uploader)s/%(upload_date)s - %(title)s.mkv"
-o "description:video/channels/%(uploader)s/descriptions/%(upload_date)s - %(title)s.%(ext)s"